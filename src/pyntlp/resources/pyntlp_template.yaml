constants:
  model_name: pyntlp
  model_tier: public
  interval_minutes: 30
  intervals_per_day: 48
  timezone: Australia/Sydney
  segment_column: segment
  output_value_column: pma_sso_mw
  schema_version: v0.1

parameters:
  # Regex patterns matched against segment values to identify residential segments.
  eligible_resi_patterns:
    - "(?i)resi"

  # Exact smart meter code used to identify eligibility.
  smart_meter_code: "SMART"

  # Exact DER type used to identify eligibility.
  eligible_der_type: "EV"

  # Policy window is start-inclusive and end-exclusive.
  # Values must align to interval_minutes.
  window_start: "10:00"
  window_end: "15:00"

  # Daily energy cap per participant in kWh.
  cap_kwh_per_day: 4.0

  # Uptake ceiling by segment. `default` is required.
  u_segment:
    default: 0.20
    Residential: 0.35

  # Linear adoption ramp across FCY.
  ramp_start_fcy: 2026
  ramp_full_fcy: 2028

  # Share of baseline daily energy considered shiftable by segment.
  s_segment:
    default: 0.05
    Residential: 0.10

  # Behaviour response multiplier applied after adoption and shiftability.
  k_response: 0.80

  # v0.1 supports flat allocation only.
  window_shape: flat
  donor_shape: flat
  energy_accounting: energy_neutral

  # Optional future-tier knobs kept public but not used by the v0.1 engine.
  season_modifiers: {}
  daytype_modifiers: {}
  rebound_share: 0.0
  rebound_shape: flat
